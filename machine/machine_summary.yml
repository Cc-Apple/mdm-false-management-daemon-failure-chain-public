reviewer_questions:
  - "Can repeated MDMStatus:false observations normally coexist with repeated management-adjacent daemon failures across multiple dates and devices?"
  - "Can managedappdistributiond / dmd / ScreenTimeAgent / ManagedSettings activity be explained as ordinary Apple / iOS behavior in the reviewed windows?"
  - "Can CommCenter / Baseband / TelephonyBaseband context be explained as independent normal behavior?"
  - "Can SFA / CKKS / CloudServices clustering be explained as ordinary account/cloud activity?"
  - "Can forceReset / stacks / JetsamEvent artifacts be explained as ordinary resource-pressure noise?"
  - "Does cross-device recurrence across 15G and mini1 remain after normal OS-version and shared-analysis-bias explanations?"
  - "Does the structure support, weaken, or falsify the broader Shadow Cloud platform-state review model?"
  - "Is the LOTL-like Apple platform-state framing useful for review, or does it introduce unnecessary bias?"

