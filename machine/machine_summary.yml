updated_shadow_cloud_framing:
  status: "public_non_attribution_framing_update"
  primary_hypothesis: "Shadow Cloud"
  recommended_framing: "LOTL-like Apple platform-state / trust-state abuse"
  short_formula: "Not living off tools. Living off Apple platform state."
  trace_location: "not in payloads, but in Apple ecosystem seams"
  meaning: >
    This repository should be read as a focused MDMStatus:false /
    management-adjacent daemon-layer anchor within the broader Shadow Cloud
    working hypothesis. The review target is not a named actor. The review target
    is whether normal Apple / iOS behavior can explain repeated clustering of
    visible management absence, management-adjacent daemon activity, restriction
    signals, telecom/baseband context, account-cloud services, and
    evidence-preservation-adjacent pressure.
  attribution: "not_asserted"

  hypothesis_stack:
    shadow_cloud:
      role: "working hypothesis name"
      attribution: "not asserted"

    lotl_like_apple_platform_state_abuse:
      role: "proposed TTP mechanism"
      meaning: >
        A mechanism-level framing in which legitimate-looking Apple platform
        states, management-adjacent daemon states, restriction states,
        account-cloud states, telecom states, and evidence-preservation behavior
        may become the anomaly surface.
      attribution: "not asserted"

    apt42_style_acms:
      role: "comparison reference"
      meaning: "account / cloud / mobile-surveillance doctrine"
      attribution: "not asserted"

    apt32_style_historical_transfer:
      role: "secondary comparison reference"
      meaning: "historical TTP transfer / old-doctrine leakage / operational-history comparison"
      attribution: "not asserted"

    liminal_style_telecom_proximity:
      role: "tertiary comparison reference"
      meaning: "telecom / proximity / condition-linked state comparison"
      attribution: "not asserted"

core_observation:
  summary: >
    MDMStatus:false repeatedly appears on days where management-adjacent daemons
    and restriction-related services fail, crash, or cluster together.
  mdm_enrollment_claim: false
  malware_claim: false
  attribution_claim: false
  classic_mdm_claim: false
  requires_qualified_forensic_review: true

  lotl_like_platform_state_relevance:
    relevant: true
    reason: >
      The observed structure is not centered on a visible malicious tool, payload,
      exploit chain, or confirmed MDM enrollment. The relevant review surface is
      the clustering of legitimate-looking Apple platform states and daemon
      behaviors while visible management indicators remain false.

