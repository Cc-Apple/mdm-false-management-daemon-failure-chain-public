working_interpretation:
  summary: >
    The observed structure is consistent with a management-adjacent failure chain
    operating while normal MDM enrollment indicators remain false.
  confidence_boundary: "working hypothesis only"
  requires_formal_review: true

  updated_platform_state_interpretation: >
    Under the revised Shadow Cloud framing, this structure is treated as a
    possible branch of LOTL-like Apple platform-state / trust-state abuse. The
    focus is not a named actor. The focus is whether legitimate-looking Apple
    platform states and daemon behaviors are clustering in a way that normal
    Apple / iOS behavior can explain.

primary_review_question: >
  Can repeated MDMStatus:false observations normally coexist with repeated
  management-adjacent daemon failures across more than one device, or does this
  structure justify deeper mobile forensic review?

expanded_platform_state_review_question: >
  Can normal Apple / iOS behavior explain a long-term, cross-device structure in
  which visible management indicators remain false while management-adjacent
  daemon activity, restriction-layer signals, telecom context, account-cloud
  services, and evidence-preservation-adjacent pressure cluster at the same seams?

